version: 2

models:
  - name: dim_listing_cleansed
    description: Cleansed table which contains Airbnb listings.
    columns:

      - name: listing_id
        description: Primary key for the listing
        tests:
          - not_null
          - unique

      - name: host_id
        description: Foreign key for the host
        tests:
          - not_null
          - relationships:
              to: ref('dim_hosts_cleansed')
              field: host_id

      - name: room_type
        tests:
          - not_null
          - accepted_values:
              values: [ 'Entire home/apt', 'Private room', 'Shared room', 'Hotel room' ]

      - name: price
        tests:
          - not_null

      - name: created_at
        tests:
          - not_null

      - name: updated_at
        tests:
          - not_null
      - name: minimum_nights
        description: '{{ doc("dim_listing_cleansed__minimum_nights")}}'
        tests:
          - positive_value
  - name: mart_fullmoon_reviews
    description: The 'mart_fullmoon_reviews' model is a combination of the 'fct_reviews' and 'seed_full_moon_dates' tables from the AIRBNB.DEV schema. It includes all columns from the 'fct_reviews' table and adds a new column 'is_full_moon' which indicates whether the review was made on a full moon day or not. The 'is_full_moon' column is determined by joining the 'fct_reviews' table with the 'seed_full_moon_dates' table on the review date.
  - name: dim_hosts_cleansed
    description: "The 'dim_hosts_cleansed' model is a transformation of the 'raw_hosts' table from the 'AIRBNB.raw' schema. It includes the following columns: 'host_id', 'host_name', 'is_superhost', 'created_at', and 'updated_at'. The 'host_name' column is coalesced with 'Anonymous' to handle null values. This model provides a cleansed and standardized view of the host data."
    columns:
      - name: host_id
        description: Unique identifier for each host. This is a primary key.
        data_type: number
      - name: host_name
        description: Name of the host. If the host's name is not provided, it is replaced with 'Anonymous'.
        data_type: varchar
      - name: is_superhost
        description: Boolean flag indicating whether the host is a superhost or not. Superhosts are experienced hosts who provide a shining example for other hosts, and extraordinary experiences for their guests.
        data_type: varchar
      - name: created_at
        description: The timestamp when the host record was first created in the Airbnb system. This is typically set when the host first registers with Airbnb and does not change afterwards.
        data_type: timestamp_ntz
      - name: updated_at
        description: The timestamp when the host record was last updated in the Airbnb system. This could be due to changes in the host's profile, status, or other related information.
        data_type: timestamp_ntz

  - name: dim_listings_w_hosts
    description: "The 'dim_listings_w_hosts' model is a combination of the 'dim_listing_cleansed' and 'dim_hosts_cleansed' tables."
    tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
           compare_model: ref('dim_listing_cleansed')
    columns:
      - name: price
        description: The price of the listing.
        tests:
          - dbt_expectations.expect_column_quantile_values_to_be_between:
              quantile: 0.99
              min_value: 50
              max_value: 500
          - dbt_expectations.expect_column_max_to_be_between:
              max_value: 5000
              config:
                severity: warn
          - dbt_expectations.except_column_values_to_be_of_type:
              column_type: number

      - name: host_name
        description: The name of the host.
        tests:
          - not_null
          - relationships:
              to: ref('dim_hosts_cleansed')
              field: host_name

      - name: listing_id
        description: Primary key for the listing.
        tests:
          - not_null


