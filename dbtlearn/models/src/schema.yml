version: 2

models:
  - name: dim_listing_cleansed
    columns: 
     
     - name: listing_id
       tests:
        - not_null
        - unique

     - name: host_id
       tests:
        - not_null
        - relationships:
            to: ref('dim_hosts_cleansed')
            field: host_id

     - name: room_type
       tests:
        - not_null
        - accepted_values:
            values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']


     - name: price
       tests:
        - not_null

     - name: created_at
       tests:
        - not_null

     - name: updated_at
       tests:
        - not_null
